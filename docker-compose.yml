version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: govex-db
    environment:
      POSTGRES_USER: govex
      POSTGRES_PASSWORD: govex_password
      POSTGRES_DB: govex
    ports:
      - "5432:5432"
    volumes:
      - govex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govex"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  govex_pgdata:
